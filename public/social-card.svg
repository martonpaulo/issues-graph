<!-- Source of truth for social-card.png. After editing, regenerate with:
     rsvg-convert -w 1200 -h 630 social-card.svg -o social-card.png
     magick social-card.png -strip -colors 256 -define png:compression-level=9 PNG8:social-card.png -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Issues Graph: the blocking order of a GitHub backlog">
  <rect width="1200" height="630" fill="#f3f5f8"/>
  <rect x="0" y="0" width="1200" height="10" fill="#1f2a37"/>
  <g transform="translate(760 315)">
    <g fill="none" stroke="#9aa7b8" stroke-width="5" stroke-linecap="round">
      <path d="M0 -150 -120 40M0 -150 120 40M-120 40 120 40M0 -150 0 40M0 40 0 150"/>
    </g>
    <g fill="#1f2a37">
      <circle cx="0" cy="-150" r="34"/>
      <circle cx="-120" cy="40" r="30"/>
      <circle cx="120" cy="40" r="30"/>
      <circle cx="0" cy="150" r="26"/>
    </g>
    <circle cx="0" cy="40" r="24" fill="#f3f5f8" stroke="#1f2a37" stroke-width="6"/>
  </g>
  <g font-family="Inter,Avenir Next,Segoe UI,system-ui,Arial,sans-serif">
    <text x="80" y="246" fill="#1f2a37" font-size="82" font-weight="700">Issues Graph</text>
    <text x="80" y="316" fill="#38506b" font-size="33" font-weight="600">See what blocks what in a GitHub backlog</text>
    <text x="80" y="374" fill="#5c6b7f" font-size="26">Native issue relationships, drawn as a graph.</text>
    <text x="80" y="416" fill="#5c6b7f" font-size="26">Nothing to install in the repository you read.</text>
    <text x="80" y="552" fill="#8b98a9" font-size="24">issues.martonpaulo.com</text>
  </g>
</svg>
