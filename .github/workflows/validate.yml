# Validates every pull request before it can merge, and every push to main.
#
# The push run is what the Deploy workflow waits for: Deploy publishes only after Validate passes on
# main, and never repeats these checks. The pull request run is
# what makes the orchestrated lane's CI states reachable: without a check run on the pull request
# head, Agent Orchestrator reports CI as unknown, never drives its own CI-fixing loop, and
# auto-merge stays disarmed because there is no required status check to gate it.
name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint and check formatting
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
