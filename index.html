<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The page keeps a visitor's GitHub token in localStorage, so the policy limits which
         script can run here and where anything can be sent. Pages serves no custom headers, so it
         is a meta tag, placed before every script, stylesheet and icon it governs; the meta form
         ignores frame-ancestors, report-uri and sandbox.
         - script-src 'self': the only executable script is Vite's module entry. The JSON-LD block
           below is data, which script-src does not govern.
         - style-src 'self' with no 'unsafe-inline': every inline style on the page (the canvas
           transform, node positions, label colours, line clamps) is written through the CSSOM by
           React and @xyflow/react, which CSP does not govern. Measured with zero violations.
         - connect-src: every request goes to api.github.com (src/github.ts).
         - worker-src 'self': ELK's worker is its own emitted asset, not a blob: URL.
         - img-src and font-src 'self': the favicon and the bundled Gabarito and Figtree; no avatars are drawn.
         - form-action 'none': the repository form is handled in script and never submits.
         vite.config.ts removes this tag from the dev server's page only, which needs inline styles
         and a websocket for hot reload. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src https://api.github.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <!-- Absolute, not relative: a real route such as /dependencies/owner/repo is served by the
         same document, and a relative icon would be looked for beside that path. -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="description" content="See which GitHub issues block which, as a graph, for any public repository. Runs in your browser with nothing to install. Free and open source." />
    <title>Issues Graph · GitHub issue dependency graph in your browser</title>
    <link rel="canonical" href="https://issues.martonpaulo.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Issues Graph" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Issues Graph · GitHub issue dependency graph in your browser" />
    <meta property="og:description" content="See which GitHub issues block which, as a graph, for any public repository. Runs in your browser with nothing to install. Free and open source." />
    <meta property="og:url" content="https://issues.martonpaulo.com/" />
    <!-- 1200x630 is the size every link preview crops to; declaring it stops the
         platforms from guessing while the image downloads. -->
    <meta property="og:image" content="https://issues.martonpaulo.com/social-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Issues Graph on a graphite card: a chain of four GitHub issues, one ready, two blocked and one needing attention, joined by blocker-to-dependent arrows." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://issues.martonpaulo.com/social-card.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Issues Graph",
        "url": "https://issues.martonpaulo.com/",
        "description": "See which GitHub issues block which, as a graph, for any public repository. Runs in your browser with nothing to install. Free and open source.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any browser",
        "image": "https://issues.martonpaulo.com/social-card.jpg",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "author": { "@type": "Person", "name": "Marton Paulo", "url": "https://martonpaulo.com" }
      }
    </script>
    <!-- Google names the site in results from this node on the home page. -->
    <script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebSite", "name": "Issues Graph", "url": "https://issues.martonpaulo.com/"}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
